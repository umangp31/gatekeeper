name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the runner's own Docker daemon (Postgres 16 + Redis 7),
      # which is available on ubuntu-latest out of the box. See doc/scope.md §10.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit
          path: "target/*-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false
